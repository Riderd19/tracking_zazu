# Entorno de desarrollo de Tracking Zazu (frontend público con Vite).
#
#   docker compose up -d        -> http://localhost:5174
#
# Conectado con Plataforma Zazu: el tracking llama a la API de Zazu (/api/public/tracking,
# /api/public/empresas, /api/public/trackingligo/qr). Esa API la llama el NAVEGADOR, no este
# contenedor, así que VITE_API_URL apunta a lo que el navegador alcanza: http://localhost:8000/api
# (el puerto de zazu-api). Por eso Zazu tiene que estar levantado antes:
#
#   cd ../Zazu && docker compose up -d
#
# La API de Zazu ya acepta orígenes http://localhost:<puerto> (config/cors.php), así que no hace
# falta tocar nada allí. Puerto 5174: el 5173 es el de la web de Zazu.
#
# Variables: se leen de `.env` (copia de `.env.example`). Vite las lee al arrancar: tras cambiar
# el `.env`, `docker compose restart tracking-web`.

name: tracking-zazu

services:
  tracking-web:
    image: node:24-alpine
    container_name: tracking-web
    working_dir: /app
    entrypoint: ["sh", "/docker/frontend.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174", "--strictPort"]
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - ./docker:/docker:ro
      # node_modules propio del contenedor (binarios de Linux, no los de Windows).
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
